name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --bin rustcleaner
      - uses: actions/upload-artifact@v4
        with:
          name: RustCleaner-Windows-x86_64
          path: target/release/rustcleaner.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          ndk_version="$(sdkmanager --list | grep -oE 'ndk;[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n 1 | cut -d ';' -f 2)"
          if [ -z "$ndk_version" ]; then
            echo "Could not find a stable Android NDK package."
            exit 1
          fi
          ndk_major="${ndk_version%%.*}"
          if [ "$ndk_major" -lt 30 ]; then
            echo "Slint's Android backend requires NDK r30 or newer; found r$ndk_major."
            exit 1
          fi
          sdkmanager --install "ndk;$ndk_version"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Build APK
        run: cargo apk2 build --release
      - name: Stage APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          apk_path="$(find . -type f -name '*.apk' -not -path './.git/*' -print -quit)"
          if [ -z "$apk_path" ]; then
            echo "cargo apk2 completed but no APK was found."
            exit 1
          fi
          cp "$apk_path" artifacts/RustCleaner-Android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RustCleaner-Android-arm64
          path: artifacts/RustCleaner-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14
