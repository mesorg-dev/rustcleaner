[package]
name = "rustcleaner"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
slint = { version = "1.19", features = ["backend-android-activity-06"] }
walkdir = "2.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
trash = "5"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
serde_json = "1"

[build-dependencies]
slint-build = "1.19"

[dev-dependencies]
jni = "0.22"
tempfile = "3"

[package.metadata.android]
package = "dev.mesorg.rustcleaner"
java_sources = "android/src/main/java"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "RustCleaner"

[[package.metadata.android.application.activity]]
name = "dev.mesorg.rustcleaner.RustCleanerActivity"
config_changes = "orientation|screenSize|keyboardHidden"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "rustcleaner"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]
